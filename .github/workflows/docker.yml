name: Docker Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Crea immagine Docker
        run: docker build -t hello-world-csharp .

      - name: Esegui container
        run: docker run --rm hello-world-csharp
